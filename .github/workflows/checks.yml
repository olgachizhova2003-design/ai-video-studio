name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - run: node --check static/app.js
      - run: node --check static/login.js
      - run: node --check static/online.js
      - run: node --check static/knowledge-ui.js
      - run: node test_knowledge_ui.cjs
      - run: node --check static/story-ui.js
      - run: node test_story_ui.cjs
